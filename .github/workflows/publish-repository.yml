name: Publish Flatpak repository

on:
  push:
    branches: [main]
    paths:
      - dev.playhorizon.Horizon.yml
      - dev.playhorizon.Horizon.metainfo.xml
      - dev.playhorizon.Horizon.desktop
      - dev.playhorizon.Horizon.flatpakref
      - .github/workflows/publish-repository.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: horizon-flatpak-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out packaging
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build the Flatpak repository
        run: |
          flatpak-builder --force-clean --user --repo=repo builddir dev.playhorizon.Horizon.yml
          flatpak build-update-repo --generate-static-deltas --prune --prune-depth=1 repo

      - name: Prepare the Pages site
        run: |
          mkdir public
          mv repo public/repo
          cp dev.playhorizon.Horizon.flatpakref public/
          touch public/.nojekyll

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
